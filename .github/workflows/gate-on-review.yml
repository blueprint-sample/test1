name: gate-on-review
on:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  actions: write
  contents: read
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gate.yml/runs?head_sha=$SHA&event=pull_request&per_page=1" --jq '.workflow_runs[0].id')
          echo "re-running gate run $id for $SHA"
          gh run rerun "$id" -R "$GITHUB_REPOSITORY"
