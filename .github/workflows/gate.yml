name: gate
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          echo "event=$GITHUB_EVENT_NAME action=$(jq -r .action "$GITHUB_EVENT_PATH") attempt=$GITHUB_RUN_ATTEMPT sha=$GITHUB_SHA ref=$GITHUB_REF"
          echo "PAYLOAD_BODY<<$(jq -r '.pull_request.body // "none"' "$GITHUB_EVENT_PATH")>>"
          api=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .body)
          echo "API_BODY<<$api>>"
          echo "PR_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)"
          case "$api" in *"GATE: pass"*) echo "verdict=pass";; *) echo "verdict=fail"; exit 1;; esac
