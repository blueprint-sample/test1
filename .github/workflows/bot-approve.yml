name: bot-approve
on:
  pull_request:
    types: [synchronize]
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review ${{ github.event.pull_request.number }} -R "$GITHUB_REPOSITORY" --approve --body "approved by the job token" && echo BOT_APPROVE_OK || echo BOT_APPROVE_FAILED
